    <meta charset="UTF-8" />

    />
    <script>
      // Apply a stored theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem("uss-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
